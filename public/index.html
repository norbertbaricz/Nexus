<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#171719">
  <meta name="description" content="Nexus connects your communities, private messages and voice rooms through one real-time workspace.">
  <title>Nexus · Your world, connected.</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <nav id="workspace-nav" class="workspace-nav" aria-label="Nexus navigation"></nav>
    <aside id="sidebar" class="sidebar" aria-label="Channels and conversations"></aside>
    <main id="main" class="main-panel" tabindex="-1">
      <div class="boot-screen"><div class="boot-logo">N</div><p>Getting your space ready…</p></div>
    </main>
    <aside id="members" class="members-panel" aria-label="Members"></aside>
  </div>
  <div id="modal-root"></div>
  <div id="popover-root"></div>
  <div id="call-dock" class="call-dock" hidden></div>
  <div id="media-root" class="media-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <input id="attachment-input" type="file" multiple hidden>
  <input id="server-image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <input id="profile-image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
</body>
</html>
